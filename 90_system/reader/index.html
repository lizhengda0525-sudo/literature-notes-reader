<!doctype html>
<html lang="zh-CN" data-theme="topaz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精读笔记库</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css">
  <link id="topaz-theme" rel="stylesheet" href="/assets/vendor/blue-topaz/theme.css">
  <link rel="stylesheet" href="/assets/reader.css">
  <link rel="stylesheet" href="/assets/desktop.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/study.css">
  <link rel="stylesheet" href="/assets/workspace.css">
  <script defer src="/assets/vendor/katex/katex.min.js"></script>
  <script defer src="/assets/vendor/dompurify/purify.min.js"></script>
  <script type="module" src="/assets/desktop-ui.mjs"></script>
</head>
<body data-view="reading">
<header class="app-bar">
  <div class="leading-tools">
    <div class="brand"><span class="book-mark" aria-hidden="true"></span><span id="project-name">文献阅读</span></div>
    <button id="library-toggle" class="panel-switch" aria-controls="library" aria-expanded="false"><span class="panel-symbol" aria-hidden="true"></span><span>论文库</span></button>
  </div>
  <nav class="view-tabs" aria-label="工作区">
    <button id="tab-reading" data-view="reading" aria-current="page">阅读</button>
    <button id="tab-resources" data-view="resources">资料库</button>
    <button id="tab-workbench" data-view="workbench">工作台</button>
  </nav>
  <div class="reader-tools">
    <button id="outline-toggle" class="panel-switch" aria-controls="outline-pane" aria-expanded="false"><span class="panel-symbol trailing" aria-hidden="true"></span><span>目录</span></button>
    <button id="focus-reading" aria-pressed="false">专注阅读</button>
    <button id="reading-settings" title="阅读设置" aria-label="阅读设置">Aa</button>
    <details id="workspace-menu">
      <summary aria-label="更多操作" title="更多操作">•••</summary>
      <div class="workspace-dropdown">
        <button id="choose-project">打开项目…</button>
        <select id="recent-projects" aria-label="最近项目"><option value="">最近项目</option></select>
        <button id="open-project-folder">打开项目文件夹</button>
        <button id="refresh">刷新资料</button>
        <hr>
        <button id="about-app">关于精读笔记库</button>
        <button id="exit-app">退出软件</button>
      </div>
    </details>
  </div>
</header>
<main id="reading-view">
  <aside class="library" id="library" aria-label="全部论文笔记">
    <div class="library-head"><h2>论文库</h2><span id="library-count"></span></div>
    <div class="library-tools">
      <label class="search-field"><span aria-hidden="true" class="lens"></span><input id="library-search" type="search" aria-label="搜索论文与笔记" placeholder="搜索题名、作者、笔记…"><kbd>/</kbd></label>
      <details id="filter-panel">
        <summary>筛选论文<span id="filter-count"></span></summary>
        <div class="filters">
          <label>阅读状态<select id="status-filter"><option value="">全部状态</option><option value="queued">待阅读</option><option value="skimmed">已速读</option><option value="deep_read">已精读</option><option value="skipped">已跳过</option></select></label>
          <label>研究问题<select id="rq-filter"><option value="">全部问题</option></select></label>
          <label>方法标签<select id="tag-filter"><option value="">全部标签</option></select></label>
        </div>
      </details>
    </div>
    <nav id="paper-list" class="paper-list" aria-label="论文列表"></nav>
    <div id="no-papers" class="empty" hidden><p id="empty-message"></p><button id="reset-filters">清除搜索和筛选</button></div>
  </aside>
  <section class="note-pane" aria-label="当前精读笔记">
    <div class="note-toolbar">
      <div class="segmented" role="group" aria-label="笔记模式"><button id="mode-read" class="active" aria-pressed="true">精读笔记</button></div>
      <button id="compare-resources" aria-controls="reference-pane" aria-expanded="false" disabled>资料对照</button>
      <div class="actions"><button id="zotero-link" disabled>打开 Zotero</button><button id="open-note" title="用本机编辑器打开 Markdown 文件" disabled>打开 Markdown ↗</button></div>
    </div>
    <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
    <div id="note-scroll" tabindex="0" aria-label="笔记正文">
      <div id="empty-reading" hidden>当前项目还没有论文笔记。</div>
      <div id="reading-page" hidden>
        <div class="reading-heading">
          <div class="paper-kicker"><span id="paper-id"></span><span id="paper-edition"></span></div>
          <h2 id="paper-title"></h2>
          <p id="paper-byline"></p><p id="paper-journal"></p>
          <div class="heading-actions"><button id="show-details" aria-expanded="false" aria-controls="paper-meta">标签与版本</button><button id="manage-zotero">管理 Zotero 关联</button></div>
          <p id="zotero-status" hidden></p>
          <div id="paper-meta" hidden></div>
        </div>
        <div id="note-content"></div>
      </div>
    </div>
    <footer><span id="note-path"></span><span id="view-status" role="status"></span></footer>
  </section>
  <aside class="outline-pane" id="outline-pane" aria-label="阅读导航">
    <div class="outline-head"><h2>本篇目录</h2><span id="scroll-percent"></span></div>
    <nav id="outline" aria-label="笔记章节"></nav>
  </aside>
  <aside id="reference-pane" aria-labelledby="reference-heading" hidden>
    <div class="reference-top"><h2 id="reference-heading">资料对照</h2><button id="close-reference" title="关闭对照，返回正文" aria-label="关闭资料对照">×</button></div>
    <select id="reference-select" aria-label="选择本篇资料"></select>
    <div id="reference-body" aria-live="polite"></div>
    <div class="reference-footer"><button id="reference-prev" aria-label="上一项资料">←</button><span id="reference-position"></span><button id="reference-next" aria-label="下一项资料">→</button><button id="reference-library">本篇资料库</button></div>
  </aside>
  <button id="panel-backdrop" aria-label="收起浮动侧栏" tabindex="-1" hidden></button>
</main>
<section id="resources-view" class="study-view" aria-labelledby="resources-heading" hidden>
  <div class="study-page">
    <header class="page-heading"><h1 id="resources-heading">资料库</h1><p id="resource-total"></p></header>
    <div class="resource-filters" aria-label="筛选资料">
      <input type="search" id="resource-search" aria-label="搜索资料" placeholder="搜索题名、编号、论文…">
      <select id="resource-paper" aria-label="按论文筛选"><option value="">全部论文</option></select>
      <select id="resource-scope" aria-label="按来源筛选"><option value="">全部来源</option><option value="main">正文</option><option value="supplement">补充材料</option></select>
    </div>
    <div class="resource-types" id="resource-kinds" role="group" aria-label="按资料类型筛选">
      <button data-kind="" aria-pressed="true">全部</button><button data-kind="figure" aria-pressed="false">图</button><button data-kind="table" aria-pressed="false">表</button><button data-kind="equation" aria-pressed="false">公式</button>
    </div>
    <div id="source-coverage"></div>
    <div id="resource-results"></div>
  </div>
</section>
<section id="workbench-view" class="study-view" aria-labelledby="workbench-heading" hidden>
  <div class="study-page">
    <header class="page-heading"><h1 id="workbench-heading">工作台</h1><p id="workbench-project"></p></header>
    <div id="workbench-content"></div>
  </div>
</section>
<dialog id="about-dialog" aria-labelledby="about-title">
  <h2 id="about-title">精读笔记库</h2>
  <p id="about-version"></p><p>在本机阅读、对照论文资料并编辑 Markdown 笔记。</p>
  <form method="dialog" class="dialog-actions"><button>关闭</button></form>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <h2 id="settings-title">阅读设置</h2>
  <label>阅读主题 <select id="theme-setting"><option value="system">跟随系统</option><option value="topaz">Blue Topaz 暗色</option><option value="light">浅色</option></select></label>
  <label>导航材质 <output id="tint-value" for="glass-tint"></output><input id="glass-tint" type="range" min="0" max="100" step="5" value="55"></label>
  <label>正文字号 <output id="font-value" for="font-size"></output><input id="font-size" type="range" min="13" max="24" value="16"></label>
  <label>正文宽度 <select id="width-setting"><option value="normal">舒适</option><option value="wide">宽屏</option></select></label>
  <div class="dialog-actions"><button id="close-settings">完成</button></div>
</dialog>
<dialog id="zotero-dialog" aria-labelledby="zotero-title">
  <div class="sheet-heading"><h2 id="zotero-title">关联 Zotero</h2><form method="dialog"><button aria-label="关闭 Zotero 关联">关闭</button></form></div>
  <p id="zotero-paper"></p>
  <form id="zotero-search-form"><input id="zotero-search" type="search" maxlength="512" aria-label="搜索本机 Zotero" placeholder="搜索本机书库的题名、作者或 DOI"><button>查找</button></form>
  <p id="zotero-feedback" role="status"></p>
  <fieldset id="zotero-results"><legend>匹配条目</legend></fieldset>
  <label id="zotero-file-row" hidden>打开目标<select id="zotero-file"></select></label>
  <div class="dialog-actions"><button id="zotero-bind" disabled>保存关联</button></div>
</dialog>
<div id="notice" role="status" hidden></div>
</body>
</html>
